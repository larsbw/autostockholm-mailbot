# Kategoriernas hinkar. Fas 4:s grind, beslutad av Lars i skiva 17.
#
# RAMVERKSREGEL 1 i CLAUDE.md §0: inget mail skickas vars kategori inte står i
# hinken `auto`. RAMVERKSREGEL 2: ingen kategori flyttas till `auto` av kod,
# bara av Lars uttryckliga beslut. Den här filen ändras alltså för hand, på
# Lars ord, och aldrig av en körning.
#
# SKÄLEN STÅR I BESLUTSLOGGEN: #29 fattade grinden, #30 avgjorde prisfrågan.
# **Den SENASTE posten går före den här filen** om de någonsin säger emot
# varandra, och posterna går före varandra i nummerordning. Kommentarerna nedan
# är korta och kan bli föråldrade av ett senare beslut; loggen är källan.
#
# STANDARDHINKEN ÄR `utkast`. En kategori som inte står nedan hamnar där, aldrig
# i `auto`. Det är avsiktligt: taxonomin kan växa, och en ny kategori som ingen
# tagit ställning till ska falla till en människa och inte gå ut som mail.

standardhink: utkast

# Kriteriet: minst tio par med svar, och att svaret inte beror på en bedömning
# i verkstaden.
#
# TOM SEDAN SKIVA 38, på Lars beslut. Se docs/beslutslogg.md #81.
#
# `fråga om a-traktorkonvertering` stod här och flyttades till `utkast`. Skälet
# är inte kategorin utan GRANNSKAPET: `boka a-traktorkonvertering` har nästan
# samma innebörd och stod i `utkast`, och klassificeraren gav samma tråd olika
# kategori i två körningar. Hinken är gränsen för om ett mail får gå ut, och den
# gränsen får inte hänga på en skillnad klassificeraren inte kan göra.
#
# AUTO FYLLS EFTER SKUGGLÄGET, när det mätt hur ofta klassificeraren vacklar
# mellan grannkategorier. Befordran ska vila på mätning.
auto: []

# Går aldrig ut automatiskt.
#
# `övrigt` TILLKOM I SKIVA 49, på Lars §10-beslut. Det är taxonomins UTTALADE
# slaskkategori: `ometikettera.bygg_system_pass2` säger *"Passar ingen kategori,
# svara exakt: övrigt"*, alltså är det etiketten för ett mail som INGEN KATEGORI
# I TAXONOMIN PASSAR. Fram till nu stod den ingenstans i den här filen och föll
# därför till standardhinken `utkast`, medan hinken som skulle fånga
# maskinmailen var oåtkomlig. Se skälet i `docs/beslutslogg.md` #114.
#
# **`övrigt` ÄR INTE SAMMA SAK SOM "INTE ETT KUNDÄRENDE", och den skillnaden
# ska stå här.** Prompten säger ingenting om kundärenden. #114 mäter att FYRA
# av korpusens åtta `övrigt`-texter besvarades av Matte, alltså var kundärenden
# taxonomin inte räckte till för. Flytten hit är ändå Lars beslut: hinken
# betyder att inget UTKAST skrivs, inte att mailet försvinner ur vyn.
#
# DE TRE SISTA NAMNEN STÅR INTE I `data/taxonomi.json`. De är kvar ändå, och
# det är ett medvetet val. Skilj på vad MODELLEN kan svara och vad KODEN kan
# sätta:
#
#   `inget kundärende` och `oklart`  är PASS 1:s etiketter. Pass 1 svarar fritt,
#       och `kategorisera.normalisera` sätter `oklart` när ett svar inte ser ut
#       som en etikett. Kedjan kör pass 2, vars svar filtreras mot taxonomin,
#       alltså kan inget av de två namnen nå `_hink_for` ur kedjan.
#   `utanför listan`  kan modellen inte heller svara. Det är en SENTINEL som
#       `ometikettera_en` returnerar när svaret inte står i taxonomin, alltså
#       sätts den av koden och ÄR nåbar ur kedjan.
#
# Att stryka de två första hade tagit bort ett skydd utan att lägga till ett:
# en etikett utan hink faller till `utkast`, alltså åt det mer tillåtande
# hållet. De står kvar med skylten på: de skyddar en väg som inte är öppen.
aldrig:
  - bestrida faktura
  - reklamera utfört arbete
  - godkänna offert
  - begära dokument
  - ansöka om praktikplats
  - ge feedback
  - övrigt
  - inget kundärende
  - oklart
  - utanför listan

# `fråga om pris a-traktorkonvertering` står i utkast. #29:s öppna punkt är
# avgjord av Lars i skiva 18, se #30, och svaret har TVÅ led:
#
# 1. Kategorin är KVALIFICERAD för `auto`. Den når tröskeln med 11 par, och
#    svaret beror inte på en bedömning i verkstaden. Det enda som hindrar den
#    är att `config/priser.json` saknas.
#
# 2. Den flyttas ändå INTE automatiskt när filen fylls. En fylld prisfil är
#    inte samma sak som verifierade priser, och flytten kräver ett nytt
#    uttryckligt beslut av Lars.
#
# Led 2 är skälet att kategorin inte kan stå här med en villkorad markering:
# en sådan hade bjudit in till att koden läser den och flyttar av sig själv,
# vilket ramverksregel 2 förbjuder.
