# Domäner som ALDRIG får klassas som maskinmail.
#
# BESLUT AV LARS, skiva 8. Listan går före härledningen, före domänlagret och
# före allt annat i `src/klassa_maskin.py`.
#
# SKÄLET: en förmedlad offertförfrågan är en KUND, och en domän som råkar
# skicka den maskinellt är fortfarande en kund. Formen är maskinell, innehållet
# är affär. Att klassa dem som maskinmail hade kastat kundärenden ur underlaget
# och gjort boten blind för en hel inflödeskanal.
#
# `googlemail.com` står här av ett annat skäl: det är Gmails
# konsumentaliasdomän, alltså privatpersoner. En härledning som fick med den
# hade klassat varje framtida kund med en sådan adress som maskinmail.
#
# UNDANTAGEN nedan är supportkanaler, inte kundkanaler, och får klassas som
# maskin. De är mer specifika än sina moderdomäner och prövas därför först.

aldrig_maskin:
  - bokadirekt.se
  - autobutler.se
  - hittabilverkstad.nu
  - verkstadsdeal.se
  - verkstadsoffert.se
  - googlemail.com

# Undantag från listan ovan. Matchas EXAKT och slår igenom subdomänregeln.
#
# Ett undantag är verkningslöst om dess ORGANISATIONSDOMÄN inte står under
# `aldrig_maskin`. Ett undantag från ett skydd som aldrig omfattade domänen gör
# ingenting. En Intercom-avsändare stod här till skiva 9 av det skälet:
# `intercom-mail.com` är en annan organisationsdomän än `bokadirekt.se`, så
# skyddet nådde den aldrig. Posten var Lars instruktion i skiva 8 och togs bort
# på Lars beslut i skiva 9.
#
# ETT UNDANTAG TAR BORT SKYDDET, INTE MER. Det som står kvar under domänen är
# `relayar_manniska`, som prövas efter förbudslistan och före huvudlagret: en
# förmedlad förfrågan därifrån vars `Reply-To` pekar på kunden klassas
# fortfarande som människa. Det som blir maskinmail är den post som varken är
# skyddad här eller pekar på en människa.
#
# `transactional.bokadirekt.se` STOD HÄR I SKIVA 50 OCH TOGS BORT SAMMA SKIVA.
# Posten var Lars §10-beslut, väg 2 ur luckan
# `sikten-ar-byggd-mot-skordar-inte-mot-dagens-post`, och drogs tillbaka av Lars
# när mätningen motsade premissen: subdomänen är inte den transaktionella halvan
# utan den som bär de förmedlade förfrågningarna. Avläst i
# `data/tradar_obesvarade.jsonl`: 60 trådar därifrån, 35 med fältet
# `Registreringsnummer`, medan organisationsdomänen `bokadirekt.se` har 19 trådar
# och noll med fältet. Talen står i `docs/sparrar.md`.
undantag:
  - support.autobutler.se
