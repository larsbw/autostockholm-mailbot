# Domäner vars post DET HÄR LAGRET tystar. Når posten hit svarar vi inte på den.
#
# **RUBRIKEN SADE "ALLTID MASKINMAIL" OCH PÅSTOD MER ÄN MÄTNINGEN BÄR.**
# Lars beslut, skiva 51. Sikten mäts mot ett SVAR FRÅN OSS och inte mot om
# posten är maskinskriven: `sunmaskin.se`, `ekvallautoteknik.se` och
# `mekonomen.se` bär handskrivna säljarbrev och betalningspåminnelser, alltså
# människor. Ingen av dem är en kund, så att sikten tystar dem är önskat
# utfall. Skälet var bara fel, och rubriken ska inte påstå mer än mätningen
# bär.
#
# *Första omskrivningen löd "vars post vi ALDRIG svarar på, oavsett huvuden".
# Den påstod mer än lagerordningen bär: `skal_maskinmail` prövar förbudslistan
# och `relayar_manniska` FÖRE domänlagret och returnerar tom sträng där, alltså
# tystas en rad nedan inte om något av de två friat posten först. "ALDRIG" var
# falskt som skrivet, och "oavsett huvuden" var det redan i den gamla lydelsen:
# huvudlagren prövas också de före. Rubriken gäller nu sitt EGET lager, vilket
# är vad raden längre ned om lagerordningen säger. Fällt av §7-granskningen av
# skiva 51.*
#
# Fältnamnet `maskindomaner` står kvar. `klassa_maskin.las_domaner` läser just
# den nyckeln, och `--harled-domaner` skriver den till kandidatfilen. En
# omdöpning hade rört kod §3 säger att låta vara.
#
# VARJE POST HÄR ÄR LARS BESLUT, ALDRIG KODENS. Filen stod tom till skiva 50.
#
# Kandidater härleds ur materialet med
#   .venv/bin/python -m src.klassa_maskin --harled-domaner
# och skrivs till den gitignorerade `scratchpad/maskindomaner-kandidater.yaml`.
# De förs över hit en och en, av en människa som känner igen avsändaren.
#
# SKÄLET ÄR UPPMÄTT. Med 91 härledda domäner och med noll gav klassningen
# identiska tal: 200/211/144 för de besvarade och 1295/309/0 för de obesvarade.
# Lagret bidrog alltså med ingenting, vilket följer av härledningen: en domän
# kommer bara med om huvudlagret redan fällt allt från den.
#
# DEN MÄTNINGEN GÄLLER DEN HÄRLEDDA LISTAN, INTE POSTERNA LÄNGST NED. De sex
# nedan är handplockade ur dagens post just därför att huvudlagret INTE fäller
# dem, alltså är de precis det härledningen aldrig kan föreslå. De flyttar 11
# trådar i `data/tradar_obesvarade.jsonl`, 2 i `data/tradar.jsonl` och 7 i
# `data/inkorg-dagens.jsonl`, och ingen av dem bär fältet `Registreringsnummer`.
#
# Kvar blir enbart framåtriktad risk, och den är konkret. Den första härledda
# listan innehöll `googlemail.com`, alltså Gmails konsumentaliasdomän: varje
# framtida kund med den adressen hade klassats som maskinmail utan att bära ett
# enda maskinhuvud. Den innehöll också flera offertförmedlare som
# VIDAREBEFORDRAR riktiga kundärenden till verkstaden.
#
# §6: en domän är inte persondata, men en domän KAN vara ett efternamn.
# Den som för över en post hit ska läsa den med det i åtanke.
#
# LAGRET ÄR SIST OCH FÄLLER BARA DET SOM ÖVERLEVT DE ANDRA. Förbudslistan och
# `relayar_manniska` prövas FÖRE, alltså kan ingen rad nedan fälla post från en
# domän förbudslistan täcker, och ingen fälla post vars `Reply-To` pekar på en
# TREDJE PART. Formulärnotisen är det senare fallet och är därför skyddad.
#
# DET RÄCKER INTE FÖR EN FÖRMEDLAD FÖRFRÅGAN, och en rad här kan tysta en sådan.
# `relayar_manniska` kräver att `Reply-To` pekar utanför avsändarens
# organisationsdomän. En förmedlare som sätter `Reply-To` till sig själv, eller
# inte alls, ger den ingenting att gå på. Avläst i `data/tradar_obesvarade.jsonl`
# för `transactional.bokadirekt.se`: 60 trådar, 35 med fältet
# `Registreringsnummer`, och NOLL som relayar en människa. Det är förbudslistan
# ensam som bär dem, inte ordningen. Den som för in en domän här ska veta att
# posten därifrån bara är skyddad om domänen står på förbudslistan.
#
# POSTERNA NEDAN ÄR LARS §10-BESLUT, SKIVA 50, halva ett ur luckan
# `sikten-ar-byggd-mot-skordar-inte-mot-dagens-post`. De är avlästa ur
# `data/inkorg-dagens.jsonl` som domäner vars post gick IGENOM sikten utan att
# bära ett huvud ur `MASKINHUVUDEN`, en `Precedence` ur `MASKINPRECEDENCE` eller
# en noreply-lokaldel.
#
# TRE DOMÄNER UR SAMMA AVLÄSNING FÖRDES ALDRIG ÖVER, och skälen är olika:
#
#   `gmail.com` och `google.com`  konsumentdomän respektive Googles egen. Samma
#                                 skäl som `googlemail.com` redan står under
#                                 `aldrig_maskin` i förbudslistan: varje framtida
#                                 kund med en sådan adress hade blivit maskinmail.
#   `melias.se`                   bär mänsklig post. Lars skäl är mätningen av
#                                 kundärenden som flyttar från besvarad till
#                                 obesvarad skörd. `scripts/besvarad-omklassning.py`
#                                 ger i dag 3 av de 90 flyttande kundärendena för
#                                 den domänen, och samma tal står i tabellen i
#                                 `docs/beslutslogg.md`. LARS UPPGAV FEM. Talet
#                                 ändrar inte beslutet, eftersom skälet är att
#                                 mänsklig post finns alls.
#
# EN FJÄRDE FÖRDES ÖVER OCH ÄR STRUKEN IGEN, Lars §10-beslut: `bildelsbasen.se`.
# Domänen bär 49 trådar över de tre materialen, och 32 av dem hade flyttat in i
# maskinmail. EN av de 32, i `data/tradar.jsonl`, har ett mänskligt svar från
# verkstaden: tråden är på sju meddelanden, varav två svar från oss på
# tillsammans 69 ord. Den bär inga maskinhuvuden och ingen `Reply-To`, alltså
# räddar `relayar_manniska` den inte. Raden gjorde den sortens tråd tyst. De sex
# som står kvar bär noll sådana trådar.
#
# EN DOMÄN MÄTS MOT SAMTLIGA MATERIAL INNAN DEN FÖRS IN, inte mot dagens skörd
# ensam. `bildelsbasen.se` syntes tre gånger i `data/inkorg-dagens.jsonl` och
# var på den avläsningen en domän bland de andra; det är först mot de tre
# materialen den bär 49 trådar och ett motexempel. Talet som avgör är
# MOTEXEMPEL PER DOMÄN, och för de sex nedan är det noll. Regeln och mätvägen
# står i `docs/sparrar.md` under
# `sikten-ar-byggd-mot-skordar-inte-mot-dagens-post`.

maskindomaner:
  - mekonomen.se
  - hedbergsbilskrot.se
  - sunmaskin.se
  - ekvallautoteknik.se
  - email.tele2.se
  - epostsystem.se
