# Domäner som ALLTID är maskinmail, oavsett huvuden.
#
# TOM MED AVSIKT. Varje post här är Lars beslut, aldrig kodens.
#
# Kandidater härleds ur materialet med
#   .venv/bin/python -m src.klassa_maskin --harled-domaner
# och skrivs till den gitignorerade `scratchpad/maskindomaner-kandidater.yaml`.
# De förs över hit en och en, av en människa som känner igen avsändaren.
#
# SKÄLET ÄR UPPMÄTT. Med 91 härledda domäner och med noll gav klassningen
# identiska tal: 200/211/144 för de besvarade och 1295/309/0 för de obesvarade.
# Lagret bidrog alltså med ingenting, vilket följer av härledningen: en domän
# kommer bara med om huvudlagret redan fällt allt från den.
#
# Kvar blir enbart framåtriktad risk, och den är konkret. Den första härledda
# listan innehöll `googlemail.com`, alltså Gmails konsumentaliasdomän: varje
# framtida kund med den adressen hade klassats som maskinmail utan att bära ett
# enda maskinhuvud. Den innehöll också flera offertförmedlare som
# VIDAREBEFORDRAR riktiga kundärenden till verkstaden.
#
# §6: en domän är inte persondata, men en domän KAN vara ett efternamn.
# Den som för över en post hit ska läsa den med det i åtanke.

